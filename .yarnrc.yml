nodeLinker: node-modules

# TypeScript 7 (compilador nativo) no expone el API JS que typescript-eslint
# necesita (peer: >=4.8.4 <6.1.0). Mientras el ecosistema de lint migra, estos
# paquetes reciben una copia anidada de TS 6 solo para el parser de ESLint;
# `tsc` (typecheck) usa el 7 de la raíz. Retirar cuando typescript-eslint
# soporte TypeScript >= 7.
packageExtensions:
  '@typescript-eslint/eslint-plugin@*':
    dependencies:
      typescript: '~6.0.3'
  '@typescript-eslint/parser@*':
    dependencies:
      typescript: '~6.0.3'
  '@typescript-eslint/project-service@*':
    dependencies:
      typescript: '~6.0.3'
  '@typescript-eslint/type-utils@*':
    dependencies:
      typescript: '~6.0.3'
  '@typescript-eslint/types@*':
    dependencies:
      typescript: '~6.0.3'
  '@typescript-eslint/typescript-estree@*':
    dependencies:
      typescript: '~6.0.3'
  'ts-api-utils@*':
    dependencies:
      typescript: '~6.0.3'
