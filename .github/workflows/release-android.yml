# Release Android — compila el APK de release en el propio runner (sin EAS ni
# cuenta de expo.dev): `expo prebuild` genera el proyecto nativo y Gradle lo
# compila. Con un tag `v*` publica un GitHub Release con el APK adjunto; también
# se puede lanzar a mano (workflow_dispatch) para probar el pipeline.
#
# Firma (opcional pero recomendada antes de distribuir):
#   1. Generar un keystore UNA vez y guardarlo en un lugar seguro — si se
#      pierde, no se pueden publicar actualizaciones con la misma firma:
#        keytool -genkeypair -v -keystore pawcare-release.keystore \
#          -alias pawcare -keyalg RSA -keysize 2048 -validity 10000
#   2. Crear estos secrets del repositorio:
#        ANDROID_KEYSTORE_BASE64  → base64 -w0 pawcare-release.keystore
#        ANDROID_KEYSTORE_PASSWORD
#        ANDROID_KEY_ALIAS        (p. ej. pawcare)
#        ANDROID_KEY_PASSWORD
#   Sin estos secrets el workflow igual compila y publica, pero el APK queda
#   firmado con el keystore debug del template (sirve para probar en emulador
#   o dispositivo, no para distribuir en serio).
#
# El versionCode ahora es manual: subirlo en app.json (expo.android.versionCode)
# antes de cada release.
#
# Los tests de integración NO corren aquí: requieren el backend de ../pawcare-web
# vivo y sembrado; son compuerta local pre-commit (ver AGENTS.md). CI valida
# typecheck + lint + formato antes de compilar.
#
# Solo Android por ahora; iOS se añadirá cuando haya cuenta de Apple Developer.

name: Release Android

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: release-android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    name: Typecheck, lint y formato
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Habilitar corepack (Yarn 4)
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Instalar dependencias
        run: yarn install --immutable

      - name: Typecheck
        run: yarn typecheck

      - name: Lint
        run: yarn lint

      - name: Formato
        run: yarn format:check

  build:
    name: Prebuild + Gradle (Android)
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: write # para crear el GitHub Release con el APK
    env:
      # Vacío si los secrets de firma no están configurados todavía.
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - name: Habilitar corepack (Yarn 4)
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Instalar dependencias
        run: yarn install --immutable

      - name: Generar proyecto nativo (expo prebuild)
        run: npx expo prebuild --platform android --no-install

      - name: Compilar APK de release
        env:
          EXPO_PUBLIC_ENV: production
        run: cd android && ./gradlew assembleRelease

      - name: Renombrar APK
        run: cp android/app/build/outputs/apk/release/app-release.apk pawcare-mobile.apk

      - name: Firmar con el keystore de release
        if: env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        # Re-firma el APK (apksigner reemplaza la firma debug del template);
        # así no hay que parchear el build.gradle generado por prebuild.
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
          BUILD_TOOLS="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          "$BUILD_TOOLS/apksigner" sign \
            --ks release.keystore \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass "pass:$KEY_PASSWORD" \
            pawcare-mobile.apk
          "$BUILD_TOOLS/apksigner" verify --print-certs pawcare-mobile.apk
          rm -f release.keystore

      - name: Avisar si el APK va con firma debug
        if: env.KEYSTORE_BASE64 == ''
        run: echo "::warning::Secrets de firma no configurados; el APK sale firmado con el keystore debug del template."

      - name: Subir APK como artifact del workflow
        uses: actions/upload-artifact@v4
        with:
          name: pawcare-mobile-android
          path: pawcare-mobile.apk
          if-no-files-found: error

      - name: Publicar GitHub Release con el APK
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" pawcare-mobile.apk \
            --title "Pawcare móvil ${GITHUB_REF_NAME}" \
            --generate-notes
