# Release Android — compila el APK de release en el propio runner (sin EAS ni
# cuenta de expo.dev): `expo prebuild` genera el proyecto nativo y Gradle lo
# compila. Publica un GitHub Release con el APK adjunto en dos casos:
#   - Cada merge (push) a `main` → release `build-<n>`, marcado como el último,
#     así el APK más reciente siempre se descarga desde
#     https://github.com/TheDigitalLab-dev/open-chepicare-mobile/releases/latest
#     (`chepicare.apk`; también se adjunta una copia idéntica con el nombre
#     anterior `open-chepicare-mobile.apk` para no romper enlaces ya compartidos)
#   - Un tag `v*` → release con ese nombre de versión.
# También se puede lanzar a mano (workflow_dispatch) para probar el pipeline;
# en ese caso solo deja el APK como artifact del workflow.
#
# Firma (opcional pero recomendada antes de distribuir):
#   1. Generar un keystore UNA vez y guardarlo en un lugar seguro — si se
#      pierde, no se pueden publicar actualizaciones con la misma firma (junto
#      con el package com.chepicare.mobile, es la identidad de la app instalada):
#        keytool -genkeypair -v -keystore chepicare-release.keystore \
#          -alias chepicare -keyalg RSA -keysize 2048 -validity 10000
#   2. Crear estos secrets del repositorio:
#        ANDROID_KEYSTORE_BASE64  → base64 -w0 chepicare-release.keystore
#        ANDROID_KEYSTORE_PASSWORD
#        ANDROID_KEY_ALIAS        (p. ej. chepicare)
#        ANDROID_KEY_PASSWORD
#   Sin estos secrets el workflow igual compila y publica, pero el APK queda
#   firmado con el keystore debug del template (sirve para probar en emulador
#   o dispositivo, no para distribuir en serio).
#
# El versionCode ahora es manual: subirlo en app.json (expo.android.versionCode)
# antes de cada release.
#
# Los tests de integración NO corren aquí: requieren el backend de ../open-chepicare-web
# vivo y sembrado; son compuerta local pre-commit (ver AGENTS.md). CI valida
# typecheck + lint + formato antes de compilar.
#
# Solo Android por ahora; iOS se añadirá cuando haya cuenta de Apple Developer.

name: Release Android

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: release-android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    name: Typecheck, lint y formato
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Sin `version:`: toma la de `packageManager` en package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Formato
        run: pnpm format:check

  build:
    name: Prebuild + Gradle (Android)
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: write # para crear el GitHub Release con el APK
    # Los secrets de firma NO van a nivel de job: solo los ven los pasos de
    # firma, nunca `pnpm install`, `expo prebuild` ni Gradle (código de terceros).
    steps:
      - uses: actions/checkout@v4

      # Sin `version:`: toma la de `packageManager` en package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Generar proyecto nativo (expo prebuild)
        run: pnpm exec expo prebuild --platform android --no-install

      - name: Compilar APK de release
        env:
          EXPO_PUBLIC_ENV: production
        run: cd android && ./gradlew assembleRelease

      - name: Renombrar APK
        run: cp android/app/build/outputs/apk/release/app-release.apk chepicare.apk

      - name: Comprobar si hay keystore de release
        id: signing
        env:
          # Vacío si los secrets de firma no están configurados todavía.
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "enabled=$([ -n "$KEYSTORE_BASE64" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Firmar con el keystore de release
        if: steps.signing.outputs.enabled == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        # Re-firma el APK (apksigner reemplaza la firma debug del template);
        # así no hay que parchear el build.gradle generado por prebuild.
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
          BUILD_TOOLS="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          "$BUILD_TOOLS/apksigner" sign \
            --ks release.keystore \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass "pass:$KEY_PASSWORD" \
            chepicare.apk
          "$BUILD_TOOLS/apksigner" verify --print-certs chepicare.apk
          rm -f release.keystore

      - name: Avisar si el APK va con firma debug
        if: steps.signing.outputs.enabled != 'true'
        run: echo "::warning::Secrets de firma no configurados; el APK sale firmado con el keystore debug del template."

      # Copia con el nombre anterior DESPUÉS de firmar (misma firma): los enlaces
      # a /releases/latest/download/open-chepicare-mobile.apk siguen sirviendo.
      - name: Copia con el nombre anterior del APK
        run: cp chepicare.apk open-chepicare-mobile.apk

      - name: Subir APK como artifact del workflow
        uses: actions/upload-artifact@v4
        with:
          name: chepicare-android
          path: chepicare.apk
          if-no-files-found: error

      - name: Publicar GitHub Release con el APK
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" chepicare.apk open-chepicare-mobile.apk \
            --title "ChepiCare móvil ${GITHUB_REF_NAME}" \
            --generate-notes

      - name: Publicar GitHub Release del build de main
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: build-${{ github.run_number }}
        # Los tags creados con GITHUB_TOKEN no disparan otro workflow, así que
        # esto no entra en bucle con el trigger de tags `v*`.
        run: |
          gh release create "$TAG" chepicare.apk open-chepicare-mobile.apk \
            --target "$GITHUB_SHA" \
            --title "ChepiCare móvil ${TAG} (main @ ${GITHUB_SHA::7})" \
            --generate-notes \
            --latest
