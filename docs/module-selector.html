body{font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--fg);line-height:1.5;padding:1.5rem;max-width:1060px;margin:0 auto}

.st{display:flex;align-items:center;gap:.3rem;font-size:.8rem;font-weight:600}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block}
.dot-t{background:var(--primary)}.dot-i{background:var(--success)}.dot-e{background:var(--danger)}.dot-r{background:var(--warning)}
.filters{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:1rem}
.fil{padding:.3rem .7rem;font-size:.75rem;font-weight:600;border:1px solid var(--border);border-radius:var(--r);cursor:pointer;background:var(--card);color:var(--fg);transition:all .15s}
.fil:hover,.fil.active{background:var(--primary);color:var(--primary-fg);border-color:var(--primary)}
.scope-section{margin-bottom:2rem}
.scope-header{font-size:1.1rem;font-weight:700;padding:.6rem .75rem;margin-bottom:.75rem;border-left:4px solid var(--primary);background:var(--secondary);border-radius:0 var(--r) var(--r) 0;display:flex;align-items:center;justify-content:space-between}
.scope-header .sh-badge{font-size:.75rem;background:var(--primary);color:var(--primary-fg);padding:.15rem .6rem;border-radius:9999px;font-weight:700}
.scope-header.admin{border-left-color:var(--danger)}.scope-header.admin .sh-badge{background:var(--danger)}
.scope-header.public{border-left-color:var(--info)}.scope-header.public .sh-badge{background:var(--info)}
.scope-header.owner{border-left-color:var(--success)}.scope-header.owner .sh-badge{background:var(--success)}
.scope-header.system{border-left-color:var(--muted-fg)}.scope-header.system .sh-badge{background:var(--muted-fg)}
.cg{margin-bottom:1.25rem}
.cg-head{display:flex;align-items:center;justify-content:space-between;padding:.5rem .75rem;background:var(--secondary);border:1px solid var(--border);border-radius:var(--r) var(--r) 0 0;cursor:pointer;user-select:none}
.cg-head:hover{background:hsl(174,25%,90%)}
.cg-name{font-size:.875rem;font-weight:700;color:var(--secondary-fg);font-family:ui-monospace,monospace}
.cg-right{display:flex;align-items:center;gap:.5rem}
.cg-badge{font-size:.65rem;background:var(--primary);color:var(--primary-fg);padding:.1rem .45rem;border-radius:9999px;font-weight:700}
.cg-badge.partial{background:var(--warning)}.cg-badge.none{background:var(--muted);color:var(--muted-fg)}
.rt{display:flex;align-items:center;gap:.5rem;padding:.35rem .75rem;border:1px solid var(--border);border-top:none;background:var(--card);font-size:.8rem;transition:all .15s}
.rt:last-child{border-radius:0 0 var(--r) var(--r)}
.rt.off{opacity:.45;background:hsl(0,10%,97%)}.rt.off .rp{text-decoration:line-through}
.cb{appearance:none;width:17px;height:17px;min-width:17px;border:2px solid var(--border);border-radius:3px;cursor:pointer;position:relative;transition:all .15s;margin:0}
.cb:checked{background:var(--success);border-color:var(--success)}
.cb:checked::after{content:"";position:absolute;left:4px;top:1px;width:4px;height:8px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
.cb-ind{background:var(--warning)!important;border-color:var(--warning)!important}
.cb-ind::after{content:"";position:absolute;left:3px;top:5.5px;width:7px;height:2px;background:#fff}
.cb-head{width:19px;height:19px;min-width:19px}
.vm{font-weight:700;min-width:3.2rem;text-align:right;font-family:ui-monospace,monospace;font-size:.75rem}
.vm.get{color:var(--success)}.vm.post{color:var(--info)}.vm.patch,.vm.put{color:var(--warning)}.vm.delete{color:var(--danger)}
.rp{font-family:ui-monospace,monospace;color:var(--fg);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:.75rem}
.rc{font-size:.65rem;color:var(--muted-fg);white-space:nowrap;font-family:ui-monospace,monospace}
.cg-notes{border:1px solid var(--border);border-top:none;padding:.4rem .75rem;background:var(--card)}
.cg-notes:last-child{border-radius:0 0 var(--r) var(--r)}
.cg-notes textarea{width:100%;font-size:.75rem;font-family:system-ui,sans-serif;border:1px solid var(--border);border-radius:3px;padding:.3rem .4rem;resize:vertical;min-height:1.8rem;color:var(--fg);background:var(--bg)}
.cg-notes textarea:focus{outline:none;border-color:var(--ring)}
.cg-notes .pr{display:flex;gap:.5rem;align-items:center;margin-bottom:.25rem}
.cg-notes label{font-size:.65rem;color:var(--muted-fg);font-weight:600}
.sel{font-size:.65rem;border:1px solid var(--border);border-radius:3px;padding:.1rem .2rem;background:var(--card);cursor:pointer}
.acts{position:sticky;bottom:0;background:var(--bg);padding:.75rem 0;border-top:1px solid var(--border);display:flex;gap:.5rem;flex-wrap:wrap;z-index:20}
.btn{display:inline-flex;align-items:center;gap:.3rem;padding:.4rem .8rem;font-size:.8rem;font-weight:600;border:1px solid transparent;border-radius:var(--r);cursor:pointer;transition:all .15s}
.btn-p{background:var(--primary);color:var(--primary-fg)}.btn-p:hover{opacity:.9}
.btn-o{border-color:var(--border);background:var(--card);color:var(--fg)}.btn-o:hover{background:var(--secondary)}
.btn-g{background:transparent;color:var(--muted-fg)}.btn-g:hover{background:var(--muted)}
.toast{position:fixed;bottom:4.5rem;left:50%;transform:translateX(-50%) translateY(80px);background:var(--fg);color:var(--bg);padding:.4rem 1rem;border-radius:var(--r);font-size:.8rem;font-weight:600;opacity:0;transition:all .3s;z-index:100}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.cg-body.collapsed .rt,.cg-body.collapsed .cg-notes{display:none}
.cg-toggle{font-size:.65rem;color:var(--primary);cursor:pointer;background:none;border:none;font-weight:700;padding:0}
</style>

<h1>ChepiCare Mobile &mdash; Selector de Rutas</h1>
<p class="sub">Todas las 332 rutas de rails-routes.txt agrupadas por controlador. Selecciona el modulo completo o rutas individuales. Exporta a JSON con &quot;Copiar JSON&quot;.</p>
<div class="bar" id="bar">
  <span class="st"><span class="dot dot-t"></span>Controladores: <span id="s-ctrl">0</span></span>
  <span class="st"><span class="dot dot-r"></span>Rutas: <span id="s-inc">0</span>/<span id="s-tot">0</span></span>
  <span class="st"><span class="dot dot-i"></span>Activas: <span id="s-on">0</span></span>
  <span class="st"><span class="dot dot-e"></span>Excluidas: <span id="s-off">0</span></span>
</div>
<div class="filters" id="filters"></div>
<div id="app"></div>
<div class="acts">
  <button class="btn btn-p" onclick="copyJSON()">Copiar JSON</button>
  <button class="btn btn-o" onclick="selAll(true)">Marcar todo</button>
  <button class="btn btn-o" onclick="selAll(false)">Desmarcar todo</button>
  <button class="btn btn-g" onclick="expandAll()">Expandir todo</button>
  <button class="btn btn-g" onclick="collapseAll()">Colapsar todo</button>
</div>
<div class="toast" id="toast"></div>

DATA.forEach(function(g){ g.notes = ""; g.priority = "none"; g.collapsed = false; });
var filter = "all";

function scope(ctrl) {
  if (ctrl.indexOf("admin/") === 0 || ctrl === "admin_pages") return "admin";
  if (ctrl.indexOf("owner_") === 0 || ctrl === "owner_medical_profiles") return "owner";
  if (ctrl.indexOf("public/") === 0) return "public";
  if (ctrl.indexOf("rails/") === 0 || ctrl.indexOf("action_mailbox") === 0 || ctrl.indexOf("active_storage") === 0) return "system";
  if (ctrl === "pages" || ctrl === "adoption" || ctrl === "sponsorships") return "public";
  if (ctrl === "auth" || ctrl === "profile" || ctrl === "dashboard" || ctrl === "pets") return "owner";
  return "other";
}

function renderFilters() {
  var scopes = ["all","owner","admin","public","system"];
  var labels = {all:"Todos",owner:"Owner",admin:"Admin",public:"Publico",system:"Sistema"};
  var el = document.getElementById("filters");
  el.innerHTML = "";
  scopes.forEach(function(s) {
    var cnt = DATA.filter(function(g){ return s==="all" || scope(g.controller)===s; }).length;
    var btn = document.createElement("button");
    btn.className = filter===s ? "fil active" : "fil";
    btn.textContent = labels[s]+" ("+cnt+")";
    btn.addEventListener("click", function(){ setFilter(s); });
    el.appendChild(btn);
  });
}

function setFilter(f){ filter=f; render(); }

function renderGroup(g, gi) {
  var total = g.routes.length;
  var on = g.routes.filter(function(r){ return r.included; }).length;
  var badgeCls = on===0 ? "none" : on<total ? "partial" : "";
  var headCb = on===total ? "checked" : "";
  var headInd = (on>0 && on<total) ? "cb-ind" : "";
  var colCls = g.collapsed ? "collapsed" : "";
  var html = "";

  html += "<div class=\"cg\" data-gi=\"" + gi + "\">";
  html += "<div class=\"cg-head\">";
  html += "<div style=\"display:flex;align-items:center;gap:.5rem\">";
  html += "<input type=\"checkbox\" class=\"cb cb-head " + headInd + "\" " + headCb + " onchange=\"togGroup(" + gi + ",this.checked)\">";
  html += "<span class=\"cg-name\">" + g.controller + "</span>";
  html += "</div>";
  html += "<div class=\"cg-right\">";
  html += "<button class=\"cg-toggle\" onclick=\"togCollapse(" + gi + ",event)\">" + (g.collapsed?"expandir":"colapsar") + "</button>";
  html += "<span class=\"cg-badge " + badgeCls + "\">" + on + "/" + total + "</span>";
  html += "</div></div>";

  html += "<div class=\"cg-body " + colCls + "\">";
  g.routes.forEach(function(r, ri) {
    var cls = r.included ? "" : "off";
    html += "<div class=\"rt " + cls + "\">";
    html += "<input type=\"checkbox\" class=\"cb\" " + (r.included?"checked":"") + " onchange=\"togRoute(" + gi + "," + ri + ",this.checked)\">";
    html += "<span class=\"vm " + r.method.toLowerCase() + "\">" + r.method + "</span>";
    html += "<span class=\"rp\" title=\"" + r.path + "\">" + r.path + "</span>";
    html += "<span class=\"rc\">" + r.controller + "</span>";
    html += "</div>";
  });
  html += "<div class=\"cg-notes\">";
  html += "<div class=\"pr\">";
  html += "<label>Prioridad:</label>";
  html += "<select class=\"sel\" onchange=\"setPri(" + gi + ",this.value)\">";
  html += "<option value=\"none\"" + (g.priority==="none"?" selected":"") + ">Sin definir</option>";
  html += "<option value=\"must\"" + (g.priority==="must"?" selected":"") + ">Must have</option>";
  html += "<option value=\"should\"" + (g.priority==="should"?" selected":"") + ">Should have</option>";
  html += "<option value=\"could\"" + (g.priority==="could"?" selected":"") + ">Could have</option>";
  html += "<option value=\"wont\"" + (g.priority==="wont"?" selected":"") + ">Wont have</option>";
  html += "</select>";
  html += "<button class=\"cg-toggle\" onclick=\"selGroupGET(" + gi + ")\">solo GET</button>";
  html += "</div>";
  html += "<textarea placeholder=\"Notas sobre este controlador...\" oninput=\"setNotes(" + gi + ",this.value)\">" + g.notes + "</textarea>";
  html += "</div></div></div>";
  return html;
}

function render() {
  renderFilters();
  var app = document.getElementById("app");
  var html = "";

  var sectionOrder = ["owner","public","admin","system"];
  var sectionLabels = {owner:"Owner (Dueno de mascota)",public:"Public (Sin autenticacion)",admin:"Admin (Panel administrativo)",system:"Sistema (Rails internals)"};

  sectionOrder.forEach(function(sec) {
    if (filter !== "all" && filter !== sec) return;
    var groups = [];
    DATA.forEach(function(g, gi) {
      if (scope(g.controller) === sec) groups.push({g:g, gi:gi});
    });
    if (groups.length === 0) return;

    var secRoutes = groups.reduce(function(s, item){ return s + item.g.routes.length; }, 0);
    var secOn = groups.reduce(function(s, item){ return s + item.g.routes.filter(function(r){return r.included;}).length; }, 0);

    html += "<div class=\"scope-section\">";
    html += "<div class=\"scope-header " + sec + "\">";
    html += "<span>" + sectionLabels[sec] + "</span>";
    html += "<span class=\"sh-badge\">" + secOn + " / " + secRoutes + " rutas</span>";
    html += "</div>";

    groups.forEach(function(item) {
      html += renderGroup(item.g, item.gi);
    });

    html += "</div>";
  });

  app.innerHTML = html;
  stats();
}

function togRoute(gi,ri,v){ DATA[gi].routes[ri].included=v; render(); }
function togGroup(gi,v){ DATA[gi].routes.forEach(function(r){r.included=v;}); render(); }
function setPri(gi,v){ DATA[gi].priority=v; }
function setNotes(gi,v){ DATA[gi].notes=v; }
function togCollapse(gi,e){ if(e)e.stopPropagation(); DATA[gi].collapsed=!DATA[gi].collapsed; render(); }
function selGroupGET(gi){ DATA[gi].routes.forEach(function(r){r.included=r.method==="GET";}); render(); }
function selAll(v){ DATA.forEach(function(g){g.routes.forEach(function(r){r.included=v;});}); render(); }
function expandAll(){ DATA.forEach(function(g){g.collapsed=false;}); render(); }
function collapseAll(){ DATA.forEach(function(g){g.collapsed=true;}); render(); }

function stats(){
  var visible = filter==="all" ? DATA : DATA.filter(function(g){return scope(g.controller)===filter;});
  var tot = visible.reduce(function(s,g){return s+g.routes.length;},0);
  var on = visible.reduce(function(s,g){return s+g.routes.filter(function(r){return r.included;}).length;},0);
  document.getElementById("s-ctrl").textContent=visible.length;
  document.getElementById("s-tot").textContent=tot;
  document.getElementById("s-inc").textContent=on;
  document.getElementById("s-on").textContent=on;
  document.getElementById("s-off").textContent=tot-on;
}

function buildJSON(){
  var res = {app:"chepicare-mobile",exported_at:new Date().toISOString(),summary:{total_controllers:0,total_routes:0,routes_included:0,routes_excluded:0},controllers:[]};
  DATA.forEach(function(g){
    var inc=g.routes.filter(function(r){return r.included;});
    var exc=g.routes.filter(function(r){return !r.included;});
    res.summary.total_controllers++;
    res.summary.total_routes+=g.routes.length;
    res.summary.routes_included+=inc.length;
    res.summary.routes_excluded+=exc.length;
    res.controllers.push({controller:g.controller,scope:scope(g.controller),priority:g.priority,notes:g.notes||null,included_routes:inc.map(function(r){return{method:r.method,path:r.path,action:r.controller};}),excluded_routes:exc.map(function(r){return{method:r.method,path:r.path,action:r.controller};})});
  });
  return res;
}

function copyJSON(){
  var j=JSON.stringify(buildJSON(),null,2);
  navigator.clipboard.writeText(j).then(function(){toast("JSON copiado al portapapeles");}).catch(function(){
    var t=document.createElement("textarea");t.value=j;document.body.appendChild(t);t.select();document.execCommand("copy");document.body.removeChild(t);toast("JSON copiado");
  });
}

function toast(m){var t=document.getElementById("toast");t.textContent=m;t.classList.add("show");setTimeout(function(){t.classList.remove("show");},2000);}

render();
</script>
</body>
</html>
